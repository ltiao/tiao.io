<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run the adjustment first</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@700&amp;family=Source+Serif+4:wght@400;600&amp;display=swap"><style>body{margin:0;background:#fafaf7}main{max-width:640px;margin:auto}svg>text:first-of-type{font-family:'Lora',Georgia,serif}</style></head><body><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 864" role="img" aria-labelledby="cheap-first-title cheap-first-desc" style="display:block;width:100%;height:auto;font-family:'Source Serif 4', Georgia, serif;text-anchor:middle"><title id="cheap-first-title">Run the adjustment first</title><desc id="cheap-first-desc">Run the adjustment first: every outcome has probability one half conditional on reaching its branch. Stop after score 82; after score 80, run larger model. Expected net value is 81.15 accuracy points.</desc>
<defs><marker id="cheap-first-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker><marker id="cheap-first-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#085ec4"/></marker><marker id="cheap-first-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#085ec4"/></marker></defs>
<rect width="640" height="864" fill="#fafaf7"/>
<text x="320" y="44" font-family="Lora, Georgia, serif" font-size="32" font-weight="700" fill="#24292f">Run the adjustment first</text>
<text x="320" y="80" font-size="24" font-weight="400" fill="#24292f">Start with an 80% model</text>
<path d="M248 224 V236 Q248 244 240 244 H168 Q160 244 160 252 V300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cheap-first-arrow)"/>
<path d="M392 224 V236 Q392 244 400 244 H472 Q480 244 480 252 V300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cheap-first-arrow)"/>
<path d="M384 476 V528 Q384 536 376 536 H168 Q160 536 160 544 V596" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cheap-first-arrow)"/>
<path d="M528 476 V588" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cheap-first-arrow)"/>
<rect x="4" y="252" width="128" height="32" fill="#fafaf7"/>
<text x="68" y="276" font-size="24" font-weight="400" fill="#24292f">½ → 82%</text>
<rect x="504" y="252" width="128" height="32" fill="#fafaf7"/>
<text x="568" y="276" font-size="24" font-weight="400" fill="#24292f">½ → 80%</text>
<rect x="196" y="548" width="128" height="32" fill="#fafaf7"/>
<text x="260" y="572" font-size="24" font-weight="400" fill="#24292f">½ → 79%</text>
<rect x="368" y="548" width="128" height="32" fill="#fafaf7"/>
<text x="432" y="572" font-size="24" font-weight="400" fill="#24292f">½ → 85%</text>
<rect x="176" y="112" width="288" height="112" rx="8" fill="#fafaf7" stroke="#4f5d75"/>
<text x="320.0" y="148" font-size="24" font-weight="600" fill="#24292f">Run adjustment</text>
<text x="320.0" y="184" font-size="24" font-weight="400" fill="#24292f">Pay 1 GPU-hour</text>
<rect x="24" y="300" width="272" height="176" rx="8" fill="#fafaf7" stroke="#4f5d75"/>
<text x="160.0" y="336" font-size="24" font-weight="600" fill="#24292f">Stop</text>
<text x="160.0" y="372" font-size="24" font-weight="400" fill="#24292f">EI 1.5 &lt; cost 2</text>
<text x="160.0" y="404" font-size="24" font-weight="400" fill="#24292f">Skip larger model</text>
<text x="160.0" y="444" font-size="24" font-weight="600" fill="#24292f">82 − 0.1 = 81.9</text>
<rect x="344" y="300" width="272" height="176" rx="8" fill="#fafaf7" stroke="#4f5d75"/>
<text x="480.0" y="336" font-size="24" font-weight="600" fill="#24292f">Run larger model</text>
<text x="480.0" y="372" font-size="24" font-weight="400" fill="#24292f">Pay 20 GPU-hours</text>
<text x="480.0" y="408" font-size="24" font-weight="400" fill="#24292f">Expected net value:</text>
<text x="480.0" y="444" font-size="24" font-weight="600" fill="#24292f">80.4</text>
<rect x="24" y="596" width="272" height="112" rx="8" fill="#fafaf7" stroke="#4f5d75"/>
<text x="160.0" y="632" font-size="24" font-weight="400" fill="#24292f">Keep best: 80%</text>
<text x="160.0" y="672" font-size="24" font-weight="600" fill="#24292f">80 − 2.1 = 77.9</text>
<rect x="344" y="596" width="272" height="112" rx="8" fill="#fafaf7" stroke="#4f5d75"/>
<text x="480.0" y="632" font-size="24" font-weight="400" fill="#24292f">Keep best: 85%</text>
<text x="480.0" y="672" font-size="24" font-weight="600" fill="#24292f">85 − 2.1 = 82.9</text>
<rect x="80" y="748" width="480" height="76" rx="8" fill="#eef4fc" stroke="#085ec4"/>
<text x="320.0" y="780" font-size="24" font-weight="600" fill="#24292f">Expected policy value</text>
<text x="320.0" y="808" font-size="24" font-weight="600" fill="#24292f">(81.9 + 80.4) / 2 = 81.15</text>
<text x="320" y="848" font-size="20" font-weight="400" fill="#24292f">Net value = best score − total cost (accuracy points)</text>
</svg></main></body></html>
