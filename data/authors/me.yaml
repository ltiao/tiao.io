experience:
  - role: Research Scientist
    org: Meta
    location: New York, NY, United States
    start: 2024-08-05
    summary: |
      **Central Applied Science (CAS) - Adaptive Experimentation (AE) Team.**
      Developing and productionizing sample-efficient Bayesian optimization and 
      AutoML methods--including early stopping, data truncation, and scaling law 
      modeling--within the open-source Ax and BoTorch frameworks. 
      Applying these methods to hyperparameter tuning and capacity management 
      for large-scale Ads ranking models. 
      Delivered millions of dollars in projected annual compute cost savings by 
      productionizing Bayesian optimization with early stopping for capacity 
      management tuning and launching early stopping for the team's flagship 
      AutoML platform. 
      Co-first author on "Ax: A Platform for Adaptive Experimentation", 
      accepted at AutoML 2025. 
      Leading cross-functional partnerships across multiple organizations to 
      drive adoption of optimization methods.
    button:
      text: View portfolio
      url: /
      icon: hero/arrow-down-tray
  - role: Applied Scientist Intern
    org: Amazon Web Services
    location: Cambridge, United Kingdom
    start: 2022-05-30
    end: 2022-09-16
    summary: |
      As an applied scientist intern at Amazon Web Services (AWS), I led an explorative research project focused on addressing the challenges of hyperparameter optimization for large language models (LLMs). Our primary objective was to gain a comprehensive understanding of the scaling behavior of LLMs and investigate the feasibility of extrapolating optimal hyperparameters from smaller LLMs to their massive counterparts.

      During this internship, I was fortunate to be reunited with Aaron Klein, Matthias Seeger, and Cedric Archambeau, with whom I had previously collaborated during an earlier internship at AWS Berlin.
  - role: Doctoral Student Researcher
    org: Secondmind
    location: Cambridge, United Kingdom
    start: 2021-09-20
    end: 2022-04-30
    summary: |
      As a student researcher at Secondmind (formerly Prowler.io), a research-intensive AI startup renowned for its innovations in Bayesian optimization and Gaussian processes, I contributed impactful research and open-source code. I developed open-source software to facilitate sampling efficiently from GPs, and led a research initiative to improve the integration of neural networks with GP approximations. These efforts culminated in a research paper selected for an oral presentation at ICML.

      I had the privilege of collaborating closely with Vincent Dutordoir and Victor Picheny during this period.
  - role: Applied Scientist Intern
    org: Amazon Web Services
    location: Berlin, Germany
    start: 2019-06-01
    end: 2019-12-01
    summary: |
      As an applied scientist intern at Amazon Web Services (AWS), I contributed to the development of the Automatic Model Tuning functionality in AWS SageMaker. My primary focus was on advancing AutoML and hyperparameter optimization, particularly Bayesian optimization methods. I spearheaded a research project aimed at integrating multi-fidelity BO with asynchronous parallelism. This initiative led to the development of a research paper and the release of open-source code within AutoGluon, subsequently forming the basis of the SyneTune library.

      I had the privilege of working closely with Matthias Seeger, Cedric Archambeau, and Aaron Klein during this internship.
  - role: Software Engineer
    org: CSIRO's Data61
    location: Sydney, Australia
    start: 2016-07-01
    end: 2019-04-01
    summary: |
      As a machine learning software engineer at CSIRO's Data61, the AI research division of Australia's national science agency, I was an integral part of the Inference Systems Engineering Team, specializing in probabilistic ML for diverse problem domains. I led the development of new microservices and contributed to the development of open-source libraries for large-scale Bayesian deep learning. I also had a stint with the Graph Analytics Engineering Team, where my contributions to research on graph representation learning led to a research paper selected for a spotlight presentation at NeurIPS.
  - role: Software Engineer
    org: National ICT Australia (NICTA)
    location: Sydney, Australia
    start: 2015-05-01
    end: 2016-06-30
    summary: |
      As a machine learning software engineer at NICTA, I was part of an interdisciplinary ML research team contributing to the Big Data Knowledge Discovery initiative. During this time, I led the development and release of numerous open-source libraries for applying Bayesian ML at scale.
  - role: Research Intern
    org: Commonwealth Scientific and Industrial Research Organisation (CSIRO)
    location: Sydney, Australia
    start: 2013-11-01
    end: 2014-02-01
    summary: |
      As a summer vacation scholar at CSIRO's Language and Social Computing team, I applied cutting-edge machine learning and natural language processing techniques to build a robust text classification system for automated sentiment analysis.
