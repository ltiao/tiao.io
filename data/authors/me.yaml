experience:
  - role: Research Scientist
    org: Meta
    location: New York, NY, United States
    start: 2024-08-05
    summary: |
      At Meta's Central Applied Science (CAS), on the Adaptive Experimentation (AE)
      team, I develop sample-efficient Bayesian optimization and AutoML methods
      within the open-source [Ax](https://ax.dev/) and
      [BoTorch](https://botorch.org/) frameworks — early stopping, data truncation,
      and scaling-law modeling — and apply them to hyperparameter tuning and
      capacity management for large-scale Ads ranking models. Co-first author on
      *Ax: A Platform for Adaptive Experimentation* (AutoML 2025).
  - role: Applied Scientist Intern
    org: Amazon Web Services
    location: Cambridge, United Kingdom
    start: 2022-05-30
    end: 2022-09-16
    summary: |
      At AWS, I led an exploratory research project on hyperparameter optimization
      for large language models, focused on the scaling behavior of LLMs and the
      feasibility of extrapolating optimal hyperparameters from smaller models to
      larger ones. Reunited with Aaron Klein, Matthias Seeger, and Cédric
      Archambeau from my earlier AWS Berlin internship.
  - role: Doctoral Student Researcher
    org: Secondmind
    location: Cambridge, United Kingdom
    start: 2021-09-20
    end: 2022-04-30
    summary: |
      At [Secondmind](https://www.secondmind.ai/) (formerly Prowler.io), an AI
      research lab focused on Bayesian optimization and Gaussian processes, I
      contributed open-source software for efficient GP sampling and led research
      on integrating neural network features into GP approximations — work that
      led to *Spherical Inducing Features for Orthogonally-Decoupled Gaussian
      Processes* (ICML 2023, Oral). Worked closely with Vincent Dutordoir and
      Victor Picheny.
  - role: Applied Scientist Intern
    org: Amazon Web Services
    location: Berlin, Germany
    start: 2019-06-01
    end: 2019-12-01
    summary: |
      At AWS, I contributed to Automatic Model Tuning in
      [SageMaker](https://aws.amazon.com/sagemaker/), focusing on Bayesian
      optimization methods for AutoML. I led research on integrating
      multi-fidelity BO with asynchronous parallelism, resulting in a paper and
      open-source code in [AutoGluon](https://auto.gluon.ai/) — work that later
      formed the basis of [SyneTune](https://github.com/awslabs/syne-tune).
      Worked with Matthias Seeger, Cédric Archambeau, and Aaron Klein.
  - role: Teaching Assistant
    org: University of New South Wales (UNSW)
    location: Sydney, Australia
    start: 2017-08-01
    end: 2018-11-30
    summary: |
      Teaching assistant for COMP9418 — Advanced Topics in Statistical Machine
      Learning, a postgraduate course covering probabilistic graphical models,
      approximate inference, and Bayesian methods.
  - role: Software Engineer
    org: CSIRO's Data61
    location: Sydney, Australia
    start: 2016-06-01
    end: 2019-04-30
    summary: |
      At [CSIRO's Data61](https://research.csiro.au/data61/) — Australia's
      national AI research division — I worked on the Inference Systems
      Engineering team, building microservices and open-source libraries for
      large-scale Bayesian deep learning. A stint with the Graph Analytics
      Engineering team led to research on graph representation learning, resulting
      in a NeurIPS spotlight paper.
  - role: Software Engineer
    org: National ICT Australia (NICTA)
    location: Sydney, Australia
    start: 2015-06-01
    end: 2016-06-30
    summary: |
      At [NICTA](https://en.wikipedia.org/wiki/NICTA), I worked on the Big Data
      Knowledge Discovery initiative within an interdisciplinary ML research team,
      developing and releasing open-source libraries for applying Bayesian ML at
      scale. NICTA later merged into CSIRO's Data61.
  - role: Research Intern
    org: Commonwealth Scientific and Industrial Research Organisation (CSIRO)
    location: Sydney, Australia
    start: 2013-11-01
    end: 2014-02-01
    summary: |
      As a summer vacation scholar with CSIRO's Language and Social Computing
      team, I built a text classification system for automated sentiment analysis
      using contemporary ML and NLP methods.
